name: Feature request
description: A new format, flag, check or integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command, option or output you would like. An example is enough.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Optional. How you handle it now.
  - type: input
    id: stack
    attributes:
      label: Your stack
      description: Optional. Framework and i18n library, e.g. Next.js + next-intl, Flutter ARB, iOS String Catalog.
